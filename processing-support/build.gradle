plugins {
    id 'processing'
    id 'com.google.protobuf'
    id 'idea'
}

dependencies {
    implementation project(':processing-meta')
    implementation project(':processing-domain')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-oauth2-client'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    implementation 'org.springframework.kafka:spring-kafka'

    implementation platform('org.springframework.grpc:spring-grpc-dependencies:1.0.3')
    implementation 'org.springframework.grpc:spring-grpc-spring-boot-starter'
    implementation 'build.buf:protovalidate:1.2.2'
    protobuf files('build.buf:protovalidate:1.2.2')

    implementation 'commons-codec:commons-codec:1.18.0'

    implementation 'org.semver4j:semver4j:6.0.0'
    implementation 'tgb.cryptoexchange:common-api:1.1.0'

    implementation 'io.jsonwebtoken:jjwt:0.13.0'

    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
}

idea {
    module {
        def generatedProtoDir = file("${projectDir}/build/generated/source/proto/main/java")

        sourceDirs += generatedProtoDir
        generatedSourceDirs += generatedProtoDir
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.34.1"
    }
    plugins {
        grpc {
            setArtifact("io.grpc:protoc-gen-grpc-java:1.81.0")
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {
                    option 'jakarta_omit'
                }
            }
        }
    }
}

bootJar {
    enabled = false
}
