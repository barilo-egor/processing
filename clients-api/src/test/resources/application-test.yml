spring:
  application:
    name: "api-clients-test"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      javax:persistence.schema-generation.database.action: none
secrets:
  master-key: "1234567890123456"
  jwt:
    private: "classpath:jwt-private.key"
    public: "classpath:jwt-public.key"
    version: "jwt-version"
    ttl-seconds: "3000"
    refresh-ttl-seconds: "30000"
kafka:
  topic:
    api-clients:
      receive: "test-withdrawal-topic"
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG