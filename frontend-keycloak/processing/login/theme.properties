# Тема входа «processing» в стиле личных кабинетов (ЛК клиента и админа).
# Берём всё от встроенной keycloak.v2 (Keycloak 26) и только перекрашиваем:
# шаблоны страниц не переопределяем — так тема не ломается при обновлении Keycloak.
parent=keycloak.v2
import=common/keycloak

# css/styles.css — файл родительской темы, processing.css — наши правки поверх
styles=css/styles.css css/processing.css

# Тёмная тема по настройке системы, как в ЛК
darkMode=true
