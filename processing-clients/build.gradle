plugins {
    id 'processing'
}

dependencies {
    implementation project(':processing-meta')
    implementation project(':processing-domain')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.security:spring-security-oauth2-core'
    testImplementation 'org.springframework.security:spring-security-oauth2-client'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    implementation 'commons-codec:commons-codec:1.18.0'
    implementation 'org.semver4j:semver4j:6.0.0'
    implementation 'tgb.cryptoexchange:common-api:1.1.0'

    implementation 'io.jsonwebtoken:jjwt:0.13.0'

    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'
}

bootJar {
    enabled = false
}