plugins {
    id 'processing'
}

dependencies {
    implementation project(':processing-meta')
    implementation project(':processing-domain')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    implementation 'commons-codec:commons-codec:1.18.0'

    implementation 'tgb.cryptoexchange:common-api:1.1.0'

    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.security:spring-security-oauth2-core'
    testImplementation 'org.springframework.security:spring-security-oauth2-client'
}

bootJar {
    enabled = false
}