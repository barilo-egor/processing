syntax = "proto3";

option java_package = "tgb.cryptoexchange.grpc.generated";
option java_multiple_files = true;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

import "buf/validate/validate.proto";

/**
 * Сервис управления транзакциями биллинга.
 * Обеспечивает создание финансовых записей и предоставление истории операций.
 */
service TransactionsService {
  /**
   * Регистрирует новую транзакцию в системе.
   * Метод является идемпотентным и защищен от повторной обработки дубликатов по ID.
   */
  rpc CreateTransaction (CreateTransactionGrpc) returns (google.protobuf.Empty);
  /**
  * Возвращает список транзакций с поддержкой гибкой фильтрации, пагинации и сортировки.
  */
  rpc GetTransactions (GetTransactionsGrpc) returns (GetTransactionsResponseGrpc);
}

message CreateTransactionGrpc {
  string id = 1 [(buf.validate.field).string.uuid = true];
  int64 client_id = 2 [(buf.validate.field).int64.gt = 0];
  int32 amount = 3 [(buf.validate.field).int32.gt = 0];
  string operation = 4 [(buf.validate.field).string.pattern = "^[A-Z_]+$"];
  string type = 5 [(buf.validate.field).string.pattern = "^[A-Z_]+$"];
  optional string comment = 6;
}

message PaginationParams {
  int32 page = 1;
  int32 size = 2;
  repeated string sorters = 3;
}

message GetTransactionsGrpc {
  PaginationParams pagination = 1;
  optional string id = 2;
  repeated int64 client_ids = 3;
  optional int32 min_amount = 4;
  optional int32 max_amount = 5;
  repeated string operations = 6;
  optional google.protobuf.Timestamp created_at_from = 7;
  optional google.protobuf.Timestamp created_at_to = 8;
}

message TransactionResponse {
  string id = 1;
  int64 client_id = 2;
  int32 amount = 3;
  string operation = 4;
  string type = 5;
  google.protobuf.Timestamp created_at = 6;
  optional string comment = 7;
}

message GetTransactionsResponseGrpc {
  repeated TransactionResponse transactions = 1;
  int64 total_elements = 2;
}