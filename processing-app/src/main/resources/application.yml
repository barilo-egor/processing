spring:
  application:
    name: "processing"
  config:
    import: 'file:config/config.yml,classpath:application-domain.yml'
  threads:
    virtual:
      enabled: true
  mvc:
    problem-details:
      enabled: true
  web:
    resources:
      static-locations: 'file:config/frontend/'
server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax