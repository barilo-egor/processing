spring:
  application:
    name: "support-users-test"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      javax:persistence.schema-generation.database.action: none
secrets:
  jwt:
    private: "classpath:jwt-private.key"
    version: "jwt-version"
    ttl-seconds: "3000"
    refresh-ttl-seconds: "30000"
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG