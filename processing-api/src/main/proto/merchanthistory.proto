syntax = "proto3";

option java_package = "net.rcetech.grpc.generated";
option java_multiple_files = true;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";

service MerchantHistoryService {
  rpc GetHistory (MerchantHistoryRequestGrpc) returns (MerchantHistoryResponseGrpc);
}

message MerchantHistoryRequestGrpc {
  PaginationGrpc pagination = 1;
  google.protobuf.StringValue order_id = 2;
  google.protobuf.StringValue operation_id = 3;
  google.protobuf.StringValue actor_id = 4;
  google.protobuf.Int64Value created_at_from = 5;
  google.protobuf.Int64Value created_at_to = 6;
  google.protobuf.StringValue initiator_app = 7;
  google.protobuf.StringValue details = 8;
  repeated google.protobuf.StringValue merchants = 9;
  google.protobuf.Int32Value merchant_amount = 10;
  google.protobuf.Int32Value requested_amount = 11;
}

message MerchantHistoryResponseDTO {
  google.protobuf.StringValue operation_id = 1;
  google.protobuf.StringValue actor_id = 2;
  google.protobuf.StringValue initiator_app = 3;
  google.protobuf.Int64Value created_at = 4;
  google.protobuf.StringValue merchant = 5;
  google.protobuf.StringValue merchant_order_id = 6;
  google.protobuf.Int32Value requested_amount = 7;
  google.protobuf.Int32Value merchant_amount = 8;
  google.protobuf.StringValue method = 9;
  google.protobuf.StringValue details = 10;
}

message MerchantHistoryResponseGrpc {
  repeated MerchantHistoryResponseDTO response = 1;
}

message PaginationGrpc {
  int32 page = 1;
  int32 size = 2;
  string sort = 3;
}
