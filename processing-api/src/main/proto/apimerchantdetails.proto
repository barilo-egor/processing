syntax = "proto3";

option java_package = "net.rcetech.grpc.generated";
option java_multiple_files = true;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

service ApiDetailsRequestService {

  rpc DetailsRequest (DetailsRequestGrpc) returns (DetailsResponseGrpc);
  rpc MerchantCallbackRequest (MerchantCallbackGrpc) returns (MerchantCallbackGrpc);

}

message DetailsRequestGrpc {
  string request_id = 1;
  string internal_id = 2;
  optional string user_id = 3;
  int32 amount = 4;
  int32 wait_timeout = 5;
  repeated string request_method = 6;
  string owner_id = 7;
}

message DetailsResponseGrpc {
  string request_id = 1;
  string merchant = 2;
  string order_id = 3;
  string  order_status = 4;
  DetailsGrpc details = 5;
  int32 amount = 6;
}

message DetailsGrpc {
  string request_method = 1;
  string details = 2;
  string bank = 3;
}

message MerchantCallbackGrpc {
  string merchant_order_id = 1;
  string status = 2;
  string status_description = 3;
  string merchant = 4;
}
