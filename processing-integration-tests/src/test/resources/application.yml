spring:
  application:
    name: "details-api-test"
  threads:
    virtual:
      enabled: true
  mvc:
    problem-details:
      enabled: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations:
      - "classpath:database/migration"
  jpa:
    hibernate:
      ddl-auto: validate
#  Проперти для автоматической генерации схемы хибернейтом
#  jpa:
#    properties:
#      jakarta:
#        persistence:
#          schema-generation:
#            scripts:
#              action: create
#              create-target: src/main/resources/schema.sql
cache:
  ttl:
    client-get-seconds: 3600
secrets:
  master-key: 'masterKeyMasterKeyMasterKeyMasterKeyMasterKey'
  jwt:
    private: 'classpath:private_key.pem'
    public: 'classpath:public_key.pem'
    ttl-seconds: 3600
    version: 1
    refresh-ttl-seconds: 1209600
kafka:
  group-id: 'processing'
  topic:
    merchant-details:
      callback: 'merchant-details-callback-v1'
  bootstrap-servers: