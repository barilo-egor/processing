spring:
  grpc:
    client:
      channels:
        api-merchant-details:
          address: "localhost:9090"
        merchant-history:
          address: "localhost:9091"
  datasource:
    username:
    password:
    url:
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:
      client:
        registration:
          keycloak-bff:
            provider: keycloak-provider
            client-id:
            client-secret:
            authorization-grant-type: authorization_code
            scope: openid,profile
        provider:
          keycloak-provider:
            issuer-uri:
  kafka:
    bootstrap-servers:
cache:
  ttl:
    client-get-seconds: 3600
details-search:
  # Максимум одновременных асинхронных поисков реквизитов. При превышении API отвечает 503.
  concurrency-limit: 200
kafka:
  group-id:
  topic:
    merchant-details:
      callback:
# Actuator (health, метрики Prometheus) слушает отдельный порт 8091 из application.yml, на основном порту приложения его нет.
# Порт не проксируется через nginx и должен быть доступен только из внутреннего VPN.
management:
  server:
    # Адрес интерфейса, на котором слушает порт actuator. В проде указать адрес сервера во внутреннем VPN.
    # Если приложение запущено в Docker, оставить 0.0.0.0 и публиковать порт только на VPN-адрес: "<vpn-ip>:8091:8091".
    address: 0.0.0.0
  endpoints:
    web:
      exposure:
        include: health,prometheus
